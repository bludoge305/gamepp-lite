# push v* 标签 → 构建 windows-gnu 主程序 + NSIS 安装包 → 自动发 GitHub Release。
# 本地等价流程：build-installer.cmd
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup 的 windows-gnu 工具链编译 raw-dylib 需要 dlltool + as；
      # rustup 自带的 dlltool 缺 as.exe，所以用 msys2 的完整 binutils（含 windres）。
      - name: Install MinGW binutils (dlltool / as / windres)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-binutils mingw-w64-x86_64-gcc
          suppress-deprecation-warnings: msystem-mingw64

      # 锁定与本地验证过的工具链一致：新版 cargo 会忽略提交的 Cargo.lock 重新解析
      # （MSRV-aware resolver），把 accesskit 等依赖升到不兼容的版本，wgpu-hal 编不过。
      - name: Install Rust 1.99.1 (x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.99.1-x86_64-pc-windows-gnu

      - name: Build gamepp-lite (release)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cargo build --release --locked --manifest-path gamepp-lite/Cargo.toml

      # 命令行版也一并编一遍：README 承诺它可独立构建，发版前必须证明这句还成立。
      - name: Build gamepp-winopt (release)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cargo build --release --locked --manifest-path gamepp-winopt/Cargo.toml

      - name: Test (protect whitelist / process matching)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cargo test --locked --manifest-path gamepp-lite/Cargo.toml

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Pack installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG -replace '^v', ''
          New-Item -ItemType Directory -Force "$PWD\dist" | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DVERSION=$v `
            /DOUTFILE="$PWD\dist\gamepp-lite-setup-$v.exe" `
            "$PWD\installer\gamepp-lite.nsi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG -replace '^v', ''
          gh release create "$env:TAG" "dist/gamepp-lite-setup-$v.exe" `
            --title "GamePP-Lite $v" `
            --generate-notes
